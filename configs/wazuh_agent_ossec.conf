<!--
=============================================================================================
  WAZUH AGENT CONFIGURATION: Windows Server 2022 Endpoint
  AUTHOR: Mohammad Hasnain Ali
  LOCATION ON ENDPOINT: C:\Program Files (x86)\ossec-agent\ossec.conf
  FEATURES: Real-Time FIM on C:\Finance, Sysmon Operational EventChannel Ingestion
=============================================================================================
-->

<ossec_config>
  <client>
    <server>
      <address>192.168.56.101</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!-- Real-Time Ransomware FIM on Protected Enterprise Share -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>
    <directories check_all="yes" realtime="yes" report_changes="yes">C:\Finance</directories>
  </syscheck>

  <!-- Event Log Ingestion -->
  <localfile>
    <location>Application</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Sysmon Operational Telemetry Ingestion -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <rootcheck>
    <disabled>no</disabled>
  </rootcheck>
</ossec_config>
