# Splunk Universal Forwarder Configuration for Windows Server
# Place in: C:\Program Files\SplunkUniversalForwarder\etc\system\local\inputs.conf

[default]
host = WIN-SERVER-2022

# Windows Security Event Log (Logons 4624/4625, Process Creation 4688)
[WinEventLog://Security]
disabled = 0
index = wineventlog
checkpointInterval = 5
current_only = 0

# Windows System Event Log (Service Installations, Driver Loads)
[WinEventLog://System]
disabled = 0
index = wineventlog
checkpointInterval = 5

# Windows Application Event Log
[WinEventLog://Application]
disabled = 0
index = wineventlog
checkpointInterval = 5

# Microsoft Sysmon Operational Log (Process Create, Network, File Create/Rename)
[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
index = wineventlog
checkpointInterval = 5
renderXml = false

# PowerShell Operational Log (Script Block Logging Event 4104)
[WinEventLog://Microsoft-Windows-PowerShell/Operational]
disabled = 0
index = wineventlog
checkpointInterval = 5
